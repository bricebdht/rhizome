name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR makes the previous run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      # `npm ci` rather than `npm install`: it installs exactly what the
      # lockfile says and fails if package.json and the lock disagree.
      - run: npm ci

      # Not `&&`-chained on purpose — each step reports separately, so a
      # failure names itself instead of stopping at the first one.
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build
